  - boot_disk_size: null
    configuration:
      - name: node.cfg
        content: |-
          #cloud-config
          # WFH user — the remote-access ("VPN") client.
          #
          # Dual-homed to two independent site head-ends:
          #   eth0 -> HQ head-end, 10.255.10.14/30 via 10.255.10.13 (metric 100)
          #   eth1 -> DR head-end, 10.255.20.26/30 via 10.255.20.25 (metric 200)
          #
          # Addresses are the peer halves of the /30s the edge routers actually allocated
          # for these links, so the two ends agree.  The default route with the LOWER
          # metric wins, so the client normally rides the HQ head-end and falls back to DR
          # automatically when the HQ path stops answering.
          hostname: wfh-user
          manage_etc_hosts: true

          write_files:
            - path: /etc/netplan/50-p45.yaml
              permissions: '0600'
              content: |
                network:
                  version: 2
                  ethernets:
                    eth0:
                      addresses: [10.255.10.14/30]
                      routes:
                        - to: 0.0.0.0/0
                          via: 10.255.10.13
                          metric: 100
                    eth1:
                      addresses: [10.255.20.26/30]
                      routes:
                        - to: 0.0.0.0/0
                          via: 10.255.20.25
                          metric: 200
                      nameservers: {addresses: [10.50.1.10, 10.50.2.10]}

          runcmd:
            - netplan apply
            # Both default routes stay installed; metric decides which is used, so a
            # head-end failure fails over without any client-side action.
            - ip route show
            - apt-get update -y
            - apt-get install -y openvpn curl dnsutils traceroute iperf3
