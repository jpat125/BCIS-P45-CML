    configuration:
      - name: hosts
        content: |-
          # records live in dnsmasq.conf
          192.168.80.53 dns-hq-1
      - name: dnsmasq.conf
        content: |-
          # ---------------------------------------------------------------- interface
          # Answer only on the server-VLAN address.  Binding explicitly matters: dnsmasq
          # otherwise listens on every interface it can find, which on a multi-homed node
          # means answering queries on a segment it has no business serving.
          listen-address=192.168.80.53
          # bind-dynamic, NOT bind-interfaces.  dnsmasq is PID 1 in this container and
          # starts before boot.sh has had a chance to address eth0.  bind-interfaces
          # demands the address exist at startup, so dnsmasq exited with "failed to create
          # listening socket: Cannot assign requested address", the container died, and
          # CML rolled the node back to DEFINED_ON_CORE with no error anywhere.
          # bind-dynamic watches netlink and binds the address when it appears.
          bind-dynamic

          # ---------------------------------------------------------------- the zone
          domain=hq.p45.local
          local=/hq.p45.local/
          # `local=` makes this server AUTHORITATIVE for the zone: a name it does not know
          # inside hq.p45.local is answered NXDOMAIN rather than forwarded.
          # Without it a typo'd internal name would be sent to the internet, where the
          # public resolver would answer with a public address — the classic split-horizon
          # leak that is very hard to spot because it half works.
          expand-hosts

          # ---------------------------------------------------------------- forwarding
          # Anything not in the internal zone goes to the DMZ resolvers, which forward on
          # to the carrier.  Internal clients therefore never talk to the internet
          # directly, and all external resolution is logged in one place.
          no-resolv
          server=10.50.1.53

          # Don't forward queries for names with no dots, or for RFC1918 reverse zones —
          # they are internal by definition and leaking them tells an outsider how the
          # network is addressed.
          domain-needed
          bogus-priv

          # ---------------------------------------------------------------- records
          # host-record, not `address=`.  Two reasons, both learned the hard way:
          #   * `address=/name/ip` is a wildcard override — it also captures every
          #     subdomain of that name, which is not what an A record means.
          #   * a `cname=` target must be a name dnsmasq genuinely holds.  CNAMEs pointed
          #     at `address=` entries do not resolve, so every service alias below silently
          #     returned nothing while the underlying hostname resolved perfectly.
          host-record=coreswitch-hq-1.hq.p45.local,192.168.90.11
          host-record=coreswitch-hq-2.hq.p45.local,192.168.90.12
          host-record=dhcp-dns-hq-1.hq.p45.local,192.168.80.10
          host-record=distswitch-hq-1.hq.p45.local,192.168.90.21
          host-record=distswitch-hq-2.hq.p45.local,192.168.90.22
          host-record=dmzdns-hq-1.hq.p45.local,10.50.1.10
          host-record=dmzdns-hq-2.hq.p45.local,10.50.1.11
          host-record=dmzswitch-hq-1.hq.p45.local,192.168.90.51
          host-record=dmzswitch-hq-2.hq.p45.local,192.168.90.52
          host-record=dns-dmz-hq-1.hq.p45.local,10.50.1.53
          host-record=dns-hq-1.hq.p45.local,192.168.80.53
          host-record=edgerouter-hq-1.hq.p45.local,192.168.90.61
          host-record=edgerouter-hq-2.hq.p45.local,192.168.90.62
          host-record=firewall-hq-1.hq.p45.local,192.168.90.71
          host-record=firewall-hq-2.hq.p45.local,192.168.90.72
          host-record=floorswitch-hq-1.hq.p45.local,192.168.90.31
          host-record=floorswitch-hq-2.hq.p45.local,192.168.90.32
          host-record=gw-dmz.hq.p45.local,10.50.1.1
          host-record=gw-finance.hq.p45.local,192.168.10.1
          host-record=gw-guest.hq.p45.local,192.168.100.1
          host-record=gw-hr.hq.p45.local,192.168.20.1
          host-record=gw-it.hq.p45.local,192.168.30.1
          host-record=gw-mgmt.hq.p45.local,192.168.90.1
          host-record=gw-rnd.hq.p45.local,192.168.40.1
          host-record=gw-sales.hq.p45.local,192.168.50.1
          host-record=gw-security.hq.p45.local,192.168.60.1
          host-record=gw-servers.hq.p45.local,192.168.80.1
          host-record=gw-techsup.hq.p45.local,192.168.70.1
          host-record=radius-hq-1.hq.p45.local,192.168.80.20
          host-record=serverroomswitch-hq-1.hq.p45.local,192.168.90.41
          host-record=serverroomswitch-hq-2.hq.p45.local,192.168.90.42
          host-record=websiteserver-hq-1.hq.p45.local,10.50.1.20
          host-record=wlc-hq-1.hq.p45.local,192.168.90.81
          host-record=wlc-hq-2.hq.p45.local,192.168.90.82

          # Service aliases staff and scripts actually use.  These are the names that make
          # DR takeover invisible to clients: a client asks for `dns`, not for a hostname.
          cname=dns.hq.p45.local,dns-hq-1.hq.p45.local
          cname=dhcp.hq.p45.local,dhcp-dns-hq-1.hq.p45.local
          cname=radius.hq.p45.local,radius-hq-1.hq.p45.local
          cname=www.hq.p45.local,websiteserver-hq-1.hq.p45.local

          # ---------------------------------------------------------------- DHCP
          # One scope per user VLAN at this site.  dnsmasq serves DNS and DHCP from the
          # same daemon, which is the reason this tier can answer "can the site still hand
          # out addresses after the other one is destroyed" — a question every disaster
          # scenario previously had to declare untested.
          #
          # EVERY REQUEST HERE ARRIVES RELAYED, and three consequences follow:
          #
          #   * The NETMASK is not optional.  dnsmasq has no interface on any of these
          #     subnets, so it cannot infer one; a range without it is rejected.
          #   * The scope is chosen by GIADDR — the relaying SVI's own address — not by the
          #     interface the packet arrived on.  That is why `ip helper-address` on the
          #     gateway is half of this feature and not a detail.
          #   * `no-dhcp-interface` was removed from this file to make any of it work: it
          #     disables DHCP on the named interface, and eth0 is the only interface there
          #     is, so with it present the daemon listened for relayed requests on nothing.
          #     There is no scope for the server VLAN itself, which is what actually keeps
          #     this resolver from answering broadcasts on its own segment.
          # VLAN 10 — FINANCE
          dhcp-range=set:vlan10,192.168.10.100,192.168.10.199,255.255.255.0,12h
          dhcp-option=tag:vlan10,option:router,192.168.10.1
          dhcp-option=tag:vlan10,option:dns-server,192.168.80.53
          dhcp-option=tag:vlan10,option:domain-name,hq.p45.local
          # VLAN 20 — HR
          dhcp-range=set:vlan20,192.168.20.100,192.168.20.199,255.255.255.0,12h
          dhcp-option=tag:vlan20,option:router,192.168.20.1
          dhcp-option=tag:vlan20,option:dns-server,192.168.80.53
          dhcp-option=tag:vlan20,option:domain-name,hq.p45.local
          # VLAN 30 — IT
          dhcp-range=set:vlan30,192.168.30.100,192.168.30.199,255.255.255.0,12h
          dhcp-option=tag:vlan30,option:router,192.168.30.1
          dhcp-option=tag:vlan30,option:dns-server,192.168.80.53
          dhcp-option=tag:vlan30,option:domain-name,hq.p45.local
          # VLAN 40 — RND
          dhcp-range=set:vlan40,192.168.40.100,192.168.40.199,255.255.255.0,12h
          dhcp-option=tag:vlan40,option:router,192.168.40.1
          dhcp-option=tag:vlan40,option:dns-server,192.168.80.53
          dhcp-option=tag:vlan40,option:domain-name,hq.p45.local
          # VLAN 50 — SALES
          dhcp-range=set:vlan50,192.168.50.100,192.168.50.199,255.255.255.0,12h
          dhcp-option=tag:vlan50,option:router,192.168.50.1
          dhcp-option=tag:vlan50,option:dns-server,192.168.80.53
          dhcp-option=tag:vlan50,option:domain-name,hq.p45.local
          # VLAN 60 — SECURITY
          dhcp-range=set:vlan60,192.168.60.100,192.168.60.199,255.255.255.0,12h
          dhcp-option=tag:vlan60,option:router,192.168.60.1
          dhcp-option=tag:vlan60,option:dns-server,192.168.80.53
          dhcp-option=tag:vlan60,option:domain-name,hq.p45.local
          # VLAN 70 — TECHSUP
          dhcp-range=set:vlan70,192.168.70.100,192.168.70.199,255.255.255.0,12h
          dhcp-option=tag:vlan70,option:router,192.168.70.1
          dhcp-option=tag:vlan70,option:dns-server,192.168.80.53
          dhcp-option=tag:vlan70,option:domain-name,hq.p45.local
          # VLAN 100 — GUEST
          dhcp-range=set:vlan100,192.168.100.100,192.168.100.199,255.255.255.0,12h
          dhcp-option=tag:vlan100,option:router,192.168.100.1
          dhcp-option=tag:vlan100,option:dns-server,192.168.80.53
          dhcp-option=tag:vlan100,option:domain-name,hq.p45.local

          # Be the authority for these scopes: NAK a client asking to renew an address
          # that is not in them, instead of staying silent and leaving it to time out.
          #
          # A WARNING THAT APPLIES TO EVERY LINE ABOVE: dnsmasq is PID 1 in this container
          # and exits on a config it cannot parse, which kills the container and rolls the
          # node back to DEFINED_ON_CORE with no error surfaced anywhere (known-issues
          # #10).  A DHCP mistake here therefore takes DNS down too — they are one daemon.
          # push_dns.py's boot.sh runs `dnsmasq --test` and records the result, so the next
          # boot can say why.
          dhcp-authoritative

          # ---------------------------------------------------------------- reverse DNS
          # reverse record for this resolver itself
          ptr-record=53.80.168.192.in-addr.arpa,dns-hq-1.hq.p45.local

          # ---------------------------------------------------------------- hygiene
          cache-size=1000
          log-queries
          # Log to stderr, which the container forwards to the CML serial console.  A file
          # path here is a boot risk for no benefit: if the directory is not writable
          # dnsmasq refuses to start, and the console is where we read these anyway.
          log-facility=-
          # Never hand out a reply we could not validate as coming from the real upstream.
          stop-dns-rebind
      - name: boot.sh
        content: |-
          #!/bin/bash
          # Generated by push_dns.py — do not edit on the node, edit the manifest.
          #
          # A dnsmasq.conf cannot give an interface an address, so the static addressing
          # lives here.  Without it the resolver comes up with no IP and answers nothing,
          # which looks identical to a broken zone file.
          {
            set -x
            ip link set eth0 up
            ip addr flush dev eth0 2>/dev/null || true
            ip addr add 192.168.80.53/24 dev eth0 2>/dev/null || true
            ip route add default via 192.168.80.1 2>/dev/null || true
            ip addr show eth0
            ip route show
            # Record whether the config would parse.  dnsmasq exits on a bad config file,
            # which kills the container; capturing --test here turns that silent death into
            # a line we can read on the next boot.
            dnsmasq --test --conf-file=/etc/dnsmasq.conf
            echo "dnsmasq --test exit=$?"
          } >/var/log/boot.log 2>&1

          # Tell CML we are up.  Nothing below this line may block.
          echo "READY" >/dev/console
          exit 0
