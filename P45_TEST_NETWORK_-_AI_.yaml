        content: |-
          !
          hostname Firewall-DR-2
          domain-name dr.p45.local
          !
          enable password autp45cml
          username admin password autp45cml privilege 15
          aaa authentication ssh console LOCAL
          !
          interface GigabitEthernet0/0
           description FO to Firewall-DR-1
           description LAN FAILOVER
          !
          interface GigabitEthernet0/1
           description to EdgeRouter-DR-2 GigabitEthernet0/3
           nameif outside
           security-level 0
           ip address 10.255.4.18 255.255.255.252
           no shutdown
          !
          interface GigabitEthernet0/2
           description to EdgeRouter-DR-1 GigabitEthernet0/4
           nameif outside
           security-level 0
           ip address 10.255.4.14 255.255.255.252
           no shutdown
          !
          interface GigabitEthernet0/3
           description to CoreSwitch-DR-2 Ethernet0/0
           nameif inside
           security-level 100
           ip address 10.255.5.14 255.255.255.252
           no shutdown
          !
          failover
          failover lan unit secondary
          failover lan interface FO GigabitEthernet0/0
          failover link FO GigabitEthernet0/0
          failover interface ip FO 10.255.5.101 255.255.255.252 standby 10.255.5.200
          !
          access-list OUTSIDE-IN extended permit icmp any any
          access-list OUTSIDE-IN extended permit tcp any host 100.22.0.20 eq https
          access-list OUTSIDE-IN extended permit tcp any host 100.22.0.20 eq http
          access-list OUTSIDE-IN extended deny ip any any
          access-group OUTSIDE-IN in interface outside
          !
          object network INSIDE-NET
           subnet 172.16.0.0 255.255.0.0
           nat (inside,outside) dynamic interface
          !
          route outside 0.0.0.0 0.0.0.0 10.255.4.17 1
          route inside 10.0.0.0 255.0.0.0 10.255.5.13 1
          route inside 172.16.0.0 255.255.0.0 10.255.5.13 1
          !
          ssh 172.16.90.0 255.255.255.0 inside
          ssh version 2
          !
          end
