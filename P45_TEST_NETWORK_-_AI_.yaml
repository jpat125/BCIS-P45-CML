          dhcp-option=tag:vlan20,option:router,172.16.20.1
          dhcp-option=tag:vlan20,option:dns-server,172.16.80.53
          dhcp-option=tag:vlan20,option:domain-name,dr.p45.local
          # VLAN 30 — IT
          dhcp-range=set:vlan30,172.16.30.100,172.16.30.199,255.255.255.0,12h
          dhcp-option=tag:vlan30,option:router,172.16.30.1
          dhcp-option=tag:vlan30,option:dns-server,172.16.80.53
          dhcp-option=tag:vlan30,option:domain-name,dr.p45.local
          # VLAN 40 — RND
          dhcp-range=set:vlan40,172.16.40.100,172.16.40.199,255.255.255.0,12h
          dhcp-option=tag:vlan40,option:router,172.16.40.1
          dhcp-option=tag:vlan40,option:dns-server,172.16.80.53
          dhcp-option=tag:vlan40,option:domain-name,dr.p45.local
