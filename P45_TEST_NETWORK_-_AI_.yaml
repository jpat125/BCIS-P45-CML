nodes:
  - boot_disk_size: null
    configuration:
      - name: day0-config
        content: |-
          : Saved

          :
          : Serial Number: 9ATG61GGD58
          : Hardware:   ASAv, 2048 MB RAM, CPU Pentium II 2100 MHz
          : Written by enable_15 at 12:33:11.295 UTC Mon Aug 17 2026
          !
          ASA Version 9.24(1)
          !
          hostname Firewall-HQ-1
          domain-name hq.p45.local
          enable password $sha512$5000$qRQm1t7OGyrdvmDwEbsO/g==$H+N3KyzdoiUdcsFxTWSeKg== pbkdf2
          service-module 0 keepalive-timeout 4
          service-module 0 keepalive-counter 6
          !
          license smart
           feature tier standard
           throughput level 1G
          names
          no mac-address auto

          !
          interface GigabitEthernet0/0
           description to EdgeRouter-HQ-1 GigabitEthernet0/3
           nameif outside
           security-level 0
           ip address 10.255.4.2 255.255.255.252
           ospf dead-interval minimal hello-multiplier 4
          !
          interface GigabitEthernet0/1
           description LAN FAILOVER LINK - unused, see the note at the top of this file
           shutdown
           no nameif
           no security-level
           no ip address
          !
          interface GigabitEthernet0/2
           description to CoreSwitch-HQ-1 Ethernet0/0
           nameif inside
           security-level 100
           ip address 10.255.5.2 255.255.255.252
           ospf dead-interval minimal hello-multiplier 4
          !
          interface GigabitEthernet0/3
           description to EdgeRouter-HQ-2 GigabitEthernet0/5
           nameif outside2
           security-level 0
           ip address 10.255.4.14 255.255.255.252
           ospf cost 100
           ospf dead-interval minimal hello-multiplier 4
          !
          interface GigabitEthernet0/4
           description to DMZSwitch-HQ-1 Ethernet0/0
           nameif dmz
           security-level 50
           ip address 10.50.1.1 255.255.255.0
           ospf dead-interval minimal hello-multiplier 4
          !
          interface GigabitEthernet0/5
           description to CoreSwitch-HQ-2 Ethernet1/3
           nameif inside2
           security-level 100
           ip address 10.255.5.30 255.255.255.252
           ospf cost 100
           ospf dead-interval minimal hello-multiplier 4
          !
          interface Management0/0
           no management-only
           shutdown
           no nameif
           no security-level
           no ip address
          !
          ftp mode passive
          dns server-group DefaultDNS
           domain-name hq.p45.local
          no object-group-search access-control
          object network INSIDE-NET
           subnet 192.168.0.0 255.255.0.0
          object network DMZ-NET
           subnet 10.50.1.0 255.255.255.0
          object network DMZ-DNS-REAL
           host 10.50.1.53
          object network DMZ-DNS-PUBLIC
           host 100.11.0.53
          object-group network CORP-ALL
           network-object 10.0.0.0 255.0.0.0
           network-object 172.16.0.0 255.255.0.0
           network-object 192.168.0.0 255.255.0.0
          access-group OUTSIDE-IN in interface outside
          access-group OUTSIDE-IN in interface outside2
          access-group DMZ-IN in interface dmz
          access-list DMZ-IN extended deny ip any4 192.168.0.0 255.255.0.0
          access-list DMZ-IN extended deny ip any4 172.16.0.0 255.255.0.0
          access-list DMZ-IN extended permit udp 10.50.1.0 255.255.255.0 any4 eq domain
          access-list DMZ-IN extended permit tcp 10.50.1.0 255.255.255.0 any4 eq domain
          access-list DMZ-IN extended permit tcp 10.50.1.0 255.255.255.0 any4 eq www
          access-list DMZ-IN extended permit tcp 10.50.1.0 255.255.255.0 any4 eq https
          access-list DMZ-IN extended permit icmp any4 any4
          access-list DMZ-IN extended deny ip any4 any4
          access-list OUTSIDE-IN extended permit icmp any4 any4
          access-list OUTSIDE-IN extended permit tcp any4 host 100.11.0.20 eq https
          access-list OUTSIDE-IN extended permit tcp any4 host 100.11.0.20 eq www
          access-list OUTSIDE-IN extended permit ospf any4 any4
          access-list OUTSIDE-IN extended permit udp any4 host 10.50.1.53 eq domain
          access-list OUTSIDE-IN extended permit tcp any4 host 10.50.1.53 eq domain
          access-list OUTSIDE-IN extended deny ip any4 any4
          pager lines 23
          mtu outside 1500
          mtu inside 1500
          mtu outside2 1500
          mtu dmz 1500
          mtu inside2 1500
          no failover
          no failover wait-disable
          no monitor-interface service-module
          icmp unreachable rate-limit 1 burst-size 1
          no asdm history enable
          arp timeout 14400
          no arp permit-nonconnected
          arp rate-limit 8192
          nat (inside,outside) source static CORP-ALL CORP-ALL destination static CORP-ALL CORP-ALL no-proxy-arp route-lookup
          nat (inside,outside) source dynamic INSIDE-NET interface
          nat (inside,outside2) source static CORP-ALL CORP-ALL destination static CORP-ALL CORP-ALL no-proxy-arp route-lookup
          nat (inside,outside2) source dynamic INSIDE-NET interface
          nat (inside,dmz) source static CORP-ALL CORP-ALL destination static CORP-ALL CORP-ALL no-proxy-arp route-lookup
          nat (dmz,outside) source static CORP-ALL CORP-ALL destination static CORP-ALL CORP-ALL no-proxy-arp route-lookup
          nat (dmz,outside) source static DMZ-DNS-REAL DMZ-DNS-PUBLIC
          nat (dmz,outside) source dynamic DMZ-NET interface
          nat (dmz,outside2) source static CORP-ALL CORP-ALL destination static CORP-ALL CORP-ALL no-proxy-arp route-lookup
          nat (dmz,outside2) source static DMZ-DNS-REAL DMZ-DNS-PUBLIC
          nat (dmz,outside2) source dynamic DMZ-NET interface
          router ospf 1
           router-id 10.255.0.71
           network 10.50.1.0 255.255.255.0 area 0
           network 10.255.4.0 255.255.255.252 area 0
           network 10.255.4.12 255.255.255.252 area 0
           network 10.255.5.0 255.255.255.252 area 0
           network 10.255.5.28 255.255.255.252 area 0
           log-adj-changes
          !
          route outside 0.0.0.0 0.0.0.0 10.255.4.1 254
          timeout xlate 3:00:00
          timeout pat-xlate 0:00:30
          timeout conn 1:00:00 half-closed 0:10:00 udp 0:02:00 sctp 0:02:00 icmp 0:00:02
          timeout sunrpc 0:10:00 h323 0:05:00 h225 1:00:00 mgcp 0:05:00 mgcp-pat 0:05:00
          timeout sip 0:30:00 sip_media 0:02:00 sip-invite 0:03:00 sip-disconnect 0:02:00
          timeout sip-provisional-media 0:02:00 uauth 0:05:00 absolute
          timeout tcp-proxy-reassembly 0:01:00
          timeout floating-conn 0:00:00
          timeout conn-holddown 0:00:15
          timeout igp stale-route 0:01:10
          user-identity default-domain LOCAL
          aaa authentication ssh console LOCAL
          aaa authentication login-history
          no snmp-server location
          no snmp-server contact
          crypto ipsec security-association pmtu-aging infinite
          crypto ca trustpoint _SmartCallHome_ServerCA
