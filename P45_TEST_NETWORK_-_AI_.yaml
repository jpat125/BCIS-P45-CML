    configuration:
      - name: clients.conf
        content: |-
          #cloud-config
          # RADIUS-HQ-1 — FreeRADIUS server
          hostname: RADIUS-HQ-1
          manage_etc_hosts: true

          write_files:
            - path: /etc/netplan/50-p45.yaml
              permissions: '0600'
              content: |
                network:
                  version: 2
                  ethernets:
                    eth0:
                      addresses: [192.168.80.20/24]
                      gateway4: 192.168.80.1
                      nameservers: {addresses: [192.168.80.10]}
                    eth1:
                      optional: true

            - path: /etc/freeradius/3.0/clients.conf.d/p45-devices.conf
              permissions: '0640'
              content: |
                client p45-devices {
                  ipaddr = 0.0.0.0/0
                  secret = P45-RADIUS-KEY
                  nas_type = cisco
                }

            - path: /etc/freeradius/3.0/mods-config/files/authorize
              append: true
              content: |
                admin Cleartext-Password := "autp45cml"
                        Service-Type = NAS-Prompt-User

          runcmd:
            - netplan apply
            - apt-get update -y
            - apt-get install -y freeradius
            - systemctl restart freeradius
    cpu_limit: null
    cpus: null
    data_volume: null
