          dhcp-option=tag:vlan60,option:router,172.16.60.1
          dhcp-option=tag:vlan60,option:dns-server,172.16.80.53
          dhcp-option=tag:vlan60,option:domain-name,dr.p45.local
          # VLAN 70 — TECHSUP
          dhcp-range=set:vlan70,172.16.70.100,172.16.70.199,255.255.255.0,12h
          dhcp-option=tag:vlan70,option:router,172.16.70.1
          dhcp-option=tag:vlan70,option:dns-server,172.16.80.53
