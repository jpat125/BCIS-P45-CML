          host-record=coreswitch-dr-2.dr.p45.local,172.16.90.12
          host-record=departmentswitch-dr-technicalsupport.dr.p45.local,172.16.90.31
          host-record=dhcp-dns-dr-1.dr.p45.local,172.16.80.10
          host-record=dmzdns-dr-1.dr.p45.local,10.50.2.10
          host-record=dmzdns-dr-2.dr.p45.local,10.50.2.11
          host-record=dmzswitch-dr-1.dr.p45.local,172.16.90.51
          host-record=dmzswitch-dr-2.dr.p45.local,172.16.90.52
          host-record=dns-dmz-dr-1.dr.p45.local,10.50.2.53
          host-record=dns-dr-1.dr.p45.local,172.16.80.53
          host-record=edgerouter-dr-1.dr.p45.local,172.16.90.61
          host-record=edgerouter-dr-2.dr.p45.local,172.16.90.62
          host-record=firewall-dr-1.dr.p45.local,172.16.90.71
          host-record=firewall-dr-2.dr.p45.local,172.16.90.72
          host-record=gw-dmz.dr.p45.local,10.50.2.1
          host-record=gw-finance.dr.p45.local,172.16.10.1
          host-record=gw-guest.dr.p45.local,172.16.100.1
          host-record=gw-hr.dr.p45.local,172.16.20.1
          host-record=gw-it.dr.p45.local,172.16.30.1
          host-record=gw-mgmt.dr.p45.local,172.16.90.1
          host-record=gw-rnd.dr.p45.local,172.16.40.1
          host-record=gw-sales.dr.p45.local,172.16.50.1
          host-record=gw-security.dr.p45.local,172.16.60.1
          host-record=gw-servers.dr.p45.local,172.16.80.1
          host-record=gw-techsup.dr.p45.local,172.16.70.1
