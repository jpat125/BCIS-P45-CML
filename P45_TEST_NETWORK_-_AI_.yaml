  - boot_disk_size: null
    configuration:
      - name: iosxe_config.txt
        content: |-
          #cloud-config
          # DHCP/DNS-HQ-1 — internal DNS + DHCP (dnsmasq)
          hostname: DHCP-DNS-HQ-1
          fqdn: DHCP-DNS-HQ-1.hq.p45.local
          manage_etc_hosts: true

          write_files:
            - path: /etc/netplan/50-p45.yaml
              permissions: '0600'
              content: |
                network:
                  version: 2
                  ethernets:
                    eth0:
                      addresses: [192.168.80.10/24]
                      gateway4: 192.168.80.1
                      nameservers: {addresses: [192.168.80.10]}
                    eth1:
                      optional: true

            - path: /etc/dnsmasq.conf
              permissions: '0644'
              content: |
                port=53
                domain-needed
                bogus-priv
                no-resolv
                server=8.8.8.8
                local=/hq.p45.local/
                address=/www.p45.local/100.11.0.20
                address=/vpn.p45.local/100.11.0.10
                # DHCP for user VLANs — served over the interface trunked from the switch.
                # Range per-VLAN configured below (helper=true means we act as relay target on other subnets).
          dhcp-range=tag:vlan10,192.168.10.100,192.168.10.200,12h
                dhcp-option=tag:vlan10,option:router,192.168.10.1
                dhcp-option=tag:vlan10,option:dns-server,192.168.80.10
          dhcp-range=tag:vlan20,192.168.20.100,192.168.20.200,12h
                dhcp-option=tag:vlan20,option:router,192.168.20.1
                dhcp-option=tag:vlan20,option:dns-server,192.168.80.10
          dhcp-range=tag:vlan30,192.168.30.100,192.168.30.200,12h
                dhcp-option=tag:vlan30,option:router,192.168.30.1
                dhcp-option=tag:vlan30,option:dns-server,192.168.80.10
          dhcp-range=tag:vlan40,192.168.40.100,192.168.40.200,12h
