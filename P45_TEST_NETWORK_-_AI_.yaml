    configuration:
      - name: clients.conf
        content: |-
          # Every NAS that may ask this server a question.
          #
          # Declared as whole subnets rather than per-device: every switch and
          # router in the estate is a NAS, they are renumbered from the manifest,
          # and a per-host list would go stale the first time one moved.
          #
          # The secret MUST match the `key` on the devices (P45-RADIUS-KEY) or the
          # server answers nothing and the device reports a timeout, which looks
          # identical to the server being down.

          client localhost {
              ipaddr = 127.0.0.1
              secret = P45-RADIUS-KEY
              require_message_authenticator = no
              nas_type = other
          }

          client p45-net-0 {
              ipaddr = 172.16.0.0/16
              secret = P45-RADIUS-KEY
              require_message_authenticator = no
              nas_type = cisco
          }

          client p45-net-1 {
              ipaddr = 10.255.0.0/16
              secret = P45-RADIUS-KEY
              require_message_authenticator = no
              nas_type = cisco
          }

          client p45-net-2 {
              ipaddr = 10.50.0.0/16
              secret = P45-RADIUS-KEY
              require_message_authenticator = no
              nas_type = cisco
          }
      - name: radiusd.conf
        content: "prefix = /usr\nexec_prefix = /usr\nsysconfdir = /etc\nlocalstatedir\
          \ = /var\nsbindir = ${exec_prefix}/sbin\nlogdir = /var/log/freeradius\n\
          raddbdir = ${sysconfdir}/freeradius/3.0\nradacctdir = ${logdir}/radacct\n\
          \nname = freeradius\nconfdir = ${raddbdir}\nmodconfdir = ${confdir}/mods-config\n\
          certdir = ${confdir}/certs\ncadir = ${confdir}/certs\nrun_dir = ${localstatedir}/run/${name}\n\
          db_dir = ${raddbdir}\nlibdir = /usr/lib/freeradius\npidfile = ${run_dir}/${name}.pid\n\
          \nmax_request_time = 30\ncleanup_delay = 5\nmax_requests = 16384\nhostname_lookups\
          \ = no\n\nlog {\n\tdestination = stdout\n\tcolourise = no\n\tstripped_names\
          \ = no\n\tauth = yes\n\tauth_badpass = yes\n\tauth_goodpass = no\n}\n\n\
          checkrad = ${sbindir}/checkrad\n\nsecurity {\n\tmax_attributes = 200\n\t\
          reject_delay = 1\n\tstatus_server = yes\n}\n\n$INCLUDE clients.conf\n\n\
          thread pool {\n\tstart_servers = 5\n\tmax_servers = 32\n\tmin_spare_servers\
          \ = 3\n\tmax_spare_servers = 10\n\tmax_requests_per_server = 0\n\tauto_limit_acct\
          \ = no\n}\n\nmodules {\n\t$INCLUDE mods-enabled/\n}\n\ninstantiate {\n}\n\
          \npolicy {\n\t$INCLUDE policy.d/\n}\n\n$INCLUDE sites-enabled/"
      - name: users
        content: |-
          # Device administration (AAA login from switches, routers and WLCs).
          p45admin Cleartext-Password := "autp45cml"
          # Wireless 802.1X account.
          wifiuser Cleartext-Password := "P45-WiFi-Pass"
          # Kept so the stock smoke test still works.
          testuser Cleartext-Password := "testpassword"
      - name: boot.sh
        content: |-
          #!/bin/bash
          # Generated by push_radius.py — do not edit on the node, edit the manifest.
          #
          # freeradius is PID 1 in this container, so this hook must exit 0 and must print
          # READY to the console or the node never reaches BOOTED.
          {
            set -x
            ip link set eth0 up
            ip addr flush dev eth0 2>/dev/null || true
            ip addr add 172.16.80.20/24 dev eth0 2>/dev/null || true
            ip route add default via 172.16.80.1 2>/dev/null || true
            ip -4 addr show
            ip route show
            # Record whether the config would actually load.  freeradius is PID 1 here, so
            # a config it cannot parse kills the container and CML rolls the node back to
            # DEFINED_ON_CORE with no error surfaced anywhere (known-issues #10).  This
            # turns that silent death into a line the next boot can be read for.
            freeradius -XC 2>&1 | tail -25
            echo "freeradius -XC exit=$?"
          } >/var/log/boot.log 2>&1

          echo "READY" >/dev/console
          exit 0
