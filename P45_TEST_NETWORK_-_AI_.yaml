nodes:
  - boot_disk_size: null
    configuration:
      - name: day0-config
        content: |-
          !
          hostname Firewall-HQ-1
          domain-name hq.p45.local
          !
          enable password autp45cml
          username admin password autp45cml privilege 15
          aaa authentication ssh console LOCAL
          !
          interface GigabitEthernet0/0
           description to EdgeRouter-HQ-1 GigabitEthernet0/3
           nameif outside
           security-level 0
           ip address 10.255.4.2 255.255.255.252
           no shutdown
          !
          interface GigabitEthernet0/1
           description FO to Firewall-HQ-2
           description LAN FAILOVER
          !
          interface GigabitEthernet0/2
           description to CoreSwitch-HQ-1 Ethernet0/0
           nameif inside
           security-level 100
           ip address 10.255.5.2 255.255.255.252
           no shutdown
          !
          failover
          failover lan unit primary
          failover lan interface FO GigabitEthernet0/1
          failover link FO GigabitEthernet0/1
          failover interface ip FO 10.255.5.100 255.255.255.252 standby 10.255.5.101
          !
          access-list OUTSIDE-IN extended permit icmp any any
          access-list OUTSIDE-IN extended permit tcp any host 100.11.0.20 eq https
          access-list OUTSIDE-IN extended permit tcp any host 100.11.0.20 eq http
          access-list OUTSIDE-IN extended deny ip any any
          access-group OUTSIDE-IN in interface outside
          !
          object network INSIDE-NET
           subnet 192.168.0.0 255.255.0.0
           nat (inside,outside) dynamic interface
          !
          route outside 0.0.0.0 0.0.0.0 10.255.4.1 1
          route inside 10.0.0.0 255.0.0.0 10.255.5.1 1
          route inside 192.168.0.0 255.255.0.0 10.255.5.1 1
          !
          ssh 192.168.90.0 255.255.255.0 inside
          ssh version 2
          !
          end
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n0
    image_definition: null
    label: Firewall-HQ-1
    node_definition: asav
    parameters: {}
    priority: null
    pyats:
      username: null
      password: null
      enable_password: null
    ram: null
    tags: []
    x: 240
