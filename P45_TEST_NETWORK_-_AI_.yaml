          # starts before boot.sh has had a chance to address eth0.  bind-interfaces
          # demands the address exist at startup, so dnsmasq exited with "failed to create
          # listening socket: Cannot assign requested address", the container died, and
          # CML rolled the node back to DEFINED_ON_CORE with no error anywhere.
