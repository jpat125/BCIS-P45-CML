!
hostname CoreSwitch-DR-2
!
no ip domain lookup
ip domain-name dr.p45.local
!
clock timezone NZST 12 0
clock summer-time NZDT recurring last Sun Sep 2:00 1 Sun Apr 3:00
ntp master 8
ntp server 10.255.0.11 prefer
logging host 172.16.80.250
!
username admin privilege 15 secret 0 <CML_PASSWORD>
enable secret 0 <CML_PASSWORD>
aaa new-model
aaa authentication login default group radius local
aaa authorization exec default group radius local
aaa authentication login CONSOLE local
radius server P45-RADIUS
 address ipv4 172.16.80.20 auth-port 1812 acct-port 1813
 key 0 P45-RADIUS-KEY
!
line con 0
 login authentication CONSOLE
!
ip routing
!
vtp mode transparent
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree loopguard default
spanning-tree vlan 1-4094 priority 8192
!
vlan 10
 name FINANCE
vlan 20
 name HR
vlan 30
 name IT
vlan 40
 name RND
vlan 50
 name SALES
vlan 60
 name SECURITY
vlan 70
 name TECHSUP
vlan 100
 name GUEST
vlan 80
 name SERVERS
vlan 90
 name MGMT
!
interface Loopback0
 description Router ID / management
 ip address 10.255.0.112 255.255.255.255
 ip ospf 1 area 0
!
ip access-list extended GUEST-IN
 remark Guest VLAN - DHCP, DNS, own gateway, public website, then internet only
 permit udp any any eq bootps
 permit udp any host 192.168.80.61 eq domain
 permit tcp any host 192.168.80.61 eq domain
 permit udp any host 172.16.80.53 eq domain
 permit tcp any host 172.16.80.53 eq domain
 permit icmp any 172.16.100.0 0.0.0.255
 permit tcp any host 10.50.100.20 eq www
 permit tcp any host 10.50.100.20 eq 443
 permit icmp any host 10.50.100.20
 deny ip any 10.0.0.0 0.255.255.255 log
 deny ip any 172.16.0.0 0.15.255.255 log
 deny ip any 192.168.0.0 0.0.255.255 log
 permit ip any any
!
interface Vlan10
 description FINANCE gateway
 ip address 172.16.10.3 255.255.255.0
 ip ospf 1 area 0
 ip ospf cost 50
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip helper-address 172.16.80.53
 ip helper-address 192.168.80.61
 standby version 2
 standby 10 ip 172.16.10.1
 standby 10 priority 100
 standby 10 preempt delay minimum 90
 standby 10 timers msec 250 msec 750
 standby 10 authentication md5 key-string <P45_HSRP_KEY>
 no shutdown
!
interface Vlan20
 description HR gateway
 ip address 172.16.20.3 255.255.255.0
 ip ospf 1 area 0
 ip ospf cost 50
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip helper-address 172.16.80.53
 ip helper-address 192.168.80.61
 standby version 2
 standby 20 ip 172.16.20.1
 standby 20 priority 100
 standby 20 preempt delay minimum 90
 standby 20 timers msec 250 msec 750
 standby 20 authentication md5 key-string <P45_HSRP_KEY>
 no shutdown
!
interface Vlan30
 description IT gateway
 ip address 172.16.30.3 255.255.255.0
 ip ospf 1 area 0
 ip ospf cost 50
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip helper-address 172.16.80.53
 ip helper-address 192.168.80.61
 standby version 2
 standby 30 ip 172.16.30.1
 standby 30 priority 100
 standby 30 preempt delay minimum 90
 standby 30 timers msec 250 msec 750
 standby 30 authentication md5 key-string <P45_HSRP_KEY>
 no shutdown
!
interface Vlan40
 description RND gateway
 ip address 172.16.40.3 255.255.255.0
 ip ospf 1 area 0
 ip ospf cost 50
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip helper-address 172.16.80.53
 ip helper-address 192.168.80.61
 standby version 2
 standby 40 ip 172.16.40.1
 standby 40 priority 100
 standby 40 preempt delay minimum 90
 standby 40 timers msec 250 msec 750
 standby 40 authentication md5 key-string <P45_HSRP_KEY>
 no shutdown
!
interface Vlan50
 description SALES gateway
 ip address 172.16.50.3 255.255.255.0
 ip ospf 1 area 0
 ip ospf cost 50
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip helper-address 172.16.80.53
 ip helper-address 192.168.80.61
 standby version 2
 standby 50 ip 172.16.50.1
 standby 50 priority 100
 standby 50 preempt delay minimum 90
 standby 50 timers msec 250 msec 750
 standby 50 authentication md5 key-string <P45_HSRP_KEY>
 no shutdown
!
interface Vlan60
 description SECURITY gateway
 ip address 172.16.60.3 255.255.255.0
 ip ospf 1 area 0
 ip ospf cost 50
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip helper-address 172.16.80.53
 ip helper-address 192.168.80.61
 standby version 2
 standby 60 ip 172.16.60.1
 standby 60 priority 100
 standby 60 preempt delay minimum 90
 standby 60 timers msec 250 msec 750
 standby 60 authentication md5 key-string <P45_HSRP_KEY>
 no shutdown
!
interface Vlan70
 description TECHSUP gateway
 ip address 172.16.70.3 255.255.255.0
 ip ospf 1 area 0
 ip ospf cost 50
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip helper-address 172.16.80.53
 ip helper-address 192.168.80.61
 standby version 2
 standby 70 ip 172.16.70.1
 standby 70 priority 100
 standby 70 preempt delay minimum 90
 standby 70 timers msec 250 msec 750
 standby 70 authentication md5 key-string <P45_HSRP_KEY>
 no shutdown
!
interface Vlan100
 description GUEST gateway
 ip address 172.16.100.3 255.255.255.0
 ip ospf 1 area 0
 ip ospf cost 50
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip helper-address 172.16.80.53
 ip helper-address 192.168.80.61
 ip access-group GUEST-IN in
 standby version 2
 standby 100 ip 172.16.100.1
 standby 100 priority 100
 standby 100 preempt delay minimum 90
 standby 100 timers msec 250 msec 750
 standby 100 authentication md5 key-string <P45_HSRP_KEY>
 no shutdown
!
interface Vlan80
 description SERVERS gateway
 ip address 172.16.80.3 255.255.255.0
 ip ospf 1 area 0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 standby version 2
 standby 80 ip 172.16.80.1
 standby 80 priority 100
 standby 80 preempt delay minimum 90
 standby 80 timers msec 250 msec 750
 standby 80 authentication md5 key-string <P45_HSRP_KEY>
 no shutdown
!
interface Vlan90
 description MGMT (DR: single L2 domain, so it IS routed)
 ip address 172.16.90.12 255.255.255.0
 ip ospf 1 area 0
 ip ospf cost 50
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 standby version 2
 standby 90 ip 172.16.90.1
 standby 90 priority 100
 standby 90 preempt delay minimum 90
 standby 90 timers msec 250 msec 750
 standby 90 authentication md5 key-string <P45_HSRP_KEY>
 no shutdown
!
interface Ethernet0/0
 description to Firewall-DR-2 GigabitEthernet0/3
 no switchport
 ip address 10.255.5.17 255.255.255.252
 ip ospf cost 50
 ip ospf dead-interval minimal hello-multiplier 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description DCI2 - to CoreSwitch-HQ-2 Ethernet1/2
 no switchport
 ip address 10.255.6.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 100
 ip ospf dead-interval minimal hello-multiplier 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/3
 description to ServerRoomSwitch-DR-2 Ethernet0/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 80,90
 no shutdown
!
interface Ethernet1/0
 description to AccessSwitch-DR-1 Ethernet0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 60,70,80,90
 no shutdown
!
interface Ethernet1/1
 description to CoreSwitch-DR-1 Ethernet1/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 10,20,30,40,50,55,60,70,80,90,100
 spanning-tree cost 150
 no shutdown
!
interface Ethernet1/2
 description to Firewall-DR-1 GigabitEthernet0/4
 no switchport
 ip address 10.255.5.21 255.255.255.252
 ip ospf cost 100
 ip ospf dead-interval minimal hello-multiplier 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip ospf 1 area 0
 no shutdown
!
ip route 192.168.0.0 255.255.0.0 Null0 254
!
ip route 10.60.0.70 255.255.255.255 172.16.80.60 250 name ANYCAST-FILESERVER
ip prefix-list ANYCAST-SVC seq 5 permit 10.60.0.70/32
route-map ANYCAST-SVC permit 10
 match ip address prefix-list ANYCAST-SVC
 set metric 20
 set metric-type type-2
 set tag 250
!
route-map ANYCAST-BACKUP-IN deny 10
 match tag 250
!
route-map ANYCAST-BACKUP-IN permit 20
!
router ospf 1
 router-id 10.255.0.112
 passive-interface default
 no passive-interface Ethernet0/0
 no passive-interface Ethernet0/2
 no passive-interface Ethernet1/2
 no passive-interface Vlan80
 redistribute static subnets route-map ANYCAST-SVC
 distribute-list route-map ANYCAST-BACKUP-IN in
!
ip access-list standard VTY-MGMT
 remark SSH to this device only from the management networks
 permit 192.168.90.0 0.0.0.255
 permit 172.16.90.0 0.0.0.255
 permit 10.255.0.0 0.0.0.255
 deny any log
!
line vty 0 4
 access-class VTY-MGMT in
 transport input ssh
 login authentication default
!
end
