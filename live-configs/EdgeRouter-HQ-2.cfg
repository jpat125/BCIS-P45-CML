!
hostname EdgeRouter-HQ-2
!
no ip domain lookup
ip domain-name hq.p45.local
ntp server 10.255.0.11 prefer
ntp server 10.255.0.12
logging host 172.16.80.250
!
username admin privilege 15 secret 0 <CML_PASSWORD>
enable secret 0 <CML_PASSWORD>
aaa new-model
aaa authentication login default group radius local
aaa authentication login CONSOLE local
radius server P45-RADIUS
 address ipv4 192.168.80.20 auth-port 1812 acct-port 1813
 key 0 P45-RADIUS-KEY
!
line con 0
 login authentication CONSOLE
!
interface Loopback0
 ip address 10.255.0.62 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description to ISP-1 (Terrestrial Fibre) GigabitEthernet0/1
 ip address 10.255.10.13 255.255.255.252
 bfd interval 500 min_rx 500 multiplier 3
 no bfd echo
 no shutdown
!
interface GigabitEthernet0/1
 description to ISP-2 (Terrestrial Fibre) GigabitEthernet0/1
 ip address 10.255.10.17 255.255.255.252
 bfd interval 500 min_rx 500 multiplier 3
 no bfd echo
 no shutdown
!
interface GigabitEthernet0/2
 description to ISP-3 (Satellite) GigabitEthernet0/1
 ip address 10.255.10.21 255.255.255.252
 bfd interval 500 min_rx 500 multiplier 3
 no bfd echo
 no shutdown
!
interface GigabitEthernet0/3
 description to Firewall-HQ-2 GigabitEthernet0/0
 ip address 10.255.4.9 255.255.255.252
 ip ospf cost 50
 ip ospf dead-interval minimal hello-multiplier 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/5
 description to Firewall-HQ-1 GigabitEthernet0/3
 ip address 10.255.4.13 255.255.255.252
 ip ospf cost 100
 ip ospf dead-interval minimal hello-multiplier 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip ospf 1 area 0
 no shutdown
!
ip route 100.11.0.53 255.255.255.255 10.255.4.14
ip route 100.11.0.20 255.255.255.255 10.255.4.14
!
ip route 192.168.0.0 255.255.0.0 Null0 254
ip route 172.16.0.0 255.255.0.0 Null0 254
ip route 10.50.0.0 255.255.0.0 Null0 254
!
!
crypto ikev2 proposal P45-WAN
 encryption aes-cbc-256
 integrity sha256
 group 14
crypto ikev2 policy P45-WAN
 proposal P45-WAN
crypto ikev2 keyring P45-WAN
 peer WAN-1
  address 10.255.0.162
  pre-shared-key <P45_WAN_PSK>
crypto ikev2 profile P45-WAN
 match identity remote address 10.255.0.162 255.255.255.255
 identity local address 10.255.0.62
 authentication remote pre-share
 authentication local pre-share
 keyring local P45-WAN
crypto ipsec transform-set P45-WAN esp-aes 256 esp-sha256-hmac
 mode transport
crypto ipsec profile P45-WAN
 set transform-set P45-WAN
 set ikev2-profile P45-WAN
!
interface Tunnel1
 description inter-site WAN to EdgeRouter-DR-2 over the carrier cloud
 ip address 10.255.3.5 255.255.255.252
 tunnel source Loopback0
 tunnel destination 10.255.0.162
 ip ospf 1 area 0
 ip ospf cost 300
 ip ospf dead-interval minimal hello-multiplier 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip mtu 1400
 ip tcp adjust-mss 1360
 tunnel protection ipsec profile P45-WAN
 no shutdown
!
router ospf 1
 router-id 10.255.0.62
 passive-interface default
 no passive-interface GigabitEthernet0/3
 no passive-interface GigabitEthernet0/5
 no passive-interface Tunnel1
 default-information originate
!
ip prefix-list P45-OUT seq 5 permit 10.255.4.8/30
ip prefix-list P45-OUT seq 10 permit 10.255.4.12/30
ip prefix-list P45-OUT seq 15 permit 192.168.0.0/16
ip prefix-list P45-OUT seq 20 permit 10.255.0.62/32
ip prefix-list P45-OUT seq 25 permit 100.11.0.20/32
ip prefix-list CARRIER-IN seq 5 permit 0.0.0.0/0
ip prefix-list CARRIER-IN seq 15 permit 10.255.0.161/32
ip prefix-list CARRIER-IN seq 20 permit 10.255.0.162/32
ip prefix-list P45-SHARED seq 5 permit 192.168.0.0/16
ip prefix-list P45-SHARED seq 10 permit 100.11.0.20/32
route-map TO-CARRIER permit 10
 match ip address prefix-list P45-SHARED
 set as-path prepend 65001 65001
route-map TO-CARRIER permit 20
route-map FROM-ISP-1 permit 10
 description primary carrier
 set local-preference 200
route-map FROM-ISP-2 permit 10
 description fibre carrier
 set local-preference 150
route-map FROM-ISP-3 permit 10
 description satellite carrier
 set local-preference 50
router bgp 65001
 bgp router-id 10.255.0.62
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.10.14 remote-as 64501
 neighbor 10.255.10.14 description ISP-1 (primary)
 neighbor 10.255.10.14 password <P45_BGP_KEY>
 neighbor 10.255.10.14 fall-over bfd
 neighbor 10.255.10.18 remote-as 64502
 neighbor 10.255.10.18 description ISP-2 (fibre)
 neighbor 10.255.10.18 password <P45_BGP_KEY>
 neighbor 10.255.10.18 fall-over bfd
 neighbor 10.255.10.22 remote-as 64503
 neighbor 10.255.10.22 description ISP-3 (satellite)
 neighbor 10.255.10.22 password <P45_BGP_KEY>
 neighbor 10.255.10.22 fall-over bfd
 !
 address-family ipv4
  network 10.255.4.8 mask 255.255.255.252
  network 10.255.4.12 mask 255.255.255.252
  network 192.168.0.0 mask 255.255.0.0
  network 10.255.0.62 mask 255.255.255.255
  network 100.11.0.20 mask 255.255.255.255
  neighbor 10.255.10.14 activate
  neighbor 10.255.10.14 prefix-list CARRIER-IN in
  neighbor 10.255.10.14 prefix-list P45-OUT out
  neighbor 10.255.10.14 route-map FROM-ISP-1 in
  neighbor 10.255.10.14 route-map TO-CARRIER out
  neighbor 10.255.10.18 activate
  neighbor 10.255.10.18 prefix-list CARRIER-IN in
  neighbor 10.255.10.18 prefix-list P45-OUT out
  neighbor 10.255.10.18 route-map FROM-ISP-2 in
  neighbor 10.255.10.18 route-map TO-CARRIER out
  neighbor 10.255.10.22 activate
  neighbor 10.255.10.22 prefix-list CARRIER-IN in
  neighbor 10.255.10.22 prefix-list P45-OUT out
  neighbor 10.255.10.22 route-map FROM-ISP-3 in
  neighbor 10.255.10.22 route-map TO-CARRIER out
 exit-address-family
!
ip access-list standard VTY-MGMT
 remark SSH to this device only from the management networks
 permit 192.168.90.0 0.0.0.255
 permit 172.16.90.0 0.0.0.255
 permit 10.255.0.0 0.0.0.255
 deny any log
!
line vty 0 15
 access-class VTY-MGMT in
 transport input ssh
 login authentication default
!
end
