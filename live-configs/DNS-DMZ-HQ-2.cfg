# ---------------------------------------------------------------- interface
listen-address=10.50.1.54
# bind-dynamic, NOT bind-interfaces — see dnsmasq_internal.j2 for why.  dnsmasq
# is PID 1 here and starts before boot.sh addresses eth0.
bind-dynamic

# ---------------------------------------------------------------- the zone
domain=p45.example
local=/p45.example/
expand-hosts
# The subnet list is the PUBLIC ranges, NOT the DMZ subnet this server sits on.
# dnsmasq only serves a name from an auth-zone when its address falls inside one
# of these subnets.  Scoping the zone to the DMZ subnet excluded every public
# record the server exists to publish, and the resolver answered NXDOMAIN for
# www and vpn while looking entirely healthy — no error, no log line.
auth-zone=p45.example,100.11.0.0/24,100.12.0.0/24,100.13.0.0/24,100.21.0.0/24,100.22.0.0/24,100.23.0.0/24
auth-server=p45.example,eth0

# ---------------------------------------------------------------- public records
# Every address here is a PUBLIC one.  If an internal 192.168/172.16 address ever
# appears in this file, the internal layout has just been published.
#
# host-record, not address=.  `address=/name/ip` is a local override that dnsmasq
# answers for its own clients; only host-record entries are carried in an
# authoritative zone, which is what makes these names answerable from off-net.
host-record=dns-dmz-dr-1.p45.example,100.22.0.53
host-record=dns-dmz-hq-1.p45.example,100.11.0.53
host-record=edgerouter-dr-2.p45.example,100.22.0.62
host-record=edgerouter-hq-1.p45.example,100.11.0.61
host-record=vpn.p45.example,100.11.0.61
host-record=websiteserver-dr-1.p45.example,100.22.0.20
host-record=websiteserver-hq-1.p45.example,100.11.0.20
host-record=www.p45.example,100.11.0.20

# ---------------------------------------------------------------- recursion policy
# Serve OUR zone to the world; recurse only for our own clients.
#
# These two lines work as a pair and neither is optional:
#   * auth-zone above makes the public names authoritative, and authoritative
#     answers are served to ANY querier — that is the server's whole job.
#   * local-service restricts RECURSION to clients on directly-connected subnets.
# An open recursive resolver on a public address is a DNS amplification weapon,
# so the internet gets our zone and nothing else.  Verified by dns_check.py, which
# resolves a public name from an off-subnet client (it must succeed) and a foreign
# name from the same client (it must not).
local-service
no-resolv
server=100.11.0.1

domain-needed
bogus-priv
stop-dns-rebind

# The carrier's resolver is a Cisco IOS router (`ip dns server`), and IOS answers
# an A query correctly and then SERVFAILs the AAAA query every stub resolver
# sends straight after it.  dnsmasq passed that failure back down the chain, so a
# client saw REFUSED for a name that had in fact just resolved perfectly.
# Filtering AAAA here answers it locally as no-data instead of forwarding it,
# which is also honest: there is no IPv6 anywhere in this network.
filter-AAAA

cache-size=1000
log-queries
log-facility=-
