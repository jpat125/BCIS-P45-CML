#cloud-config
# RADIUS-DR-1 — FreeRADIUS server
hostname: RADIUS-DR-1
manage_etc_hosts: true

write_files:
  - path: /etc/netplan/50-p45.yaml
    permissions: '0600'
    content: |
      network:
        version: 2
        ethernets:
          eth0:
            addresses: [172.16.80.20/24]
            gateway4: 172.16.80.1
            nameservers: {addresses: [172.16.80.53]}
          eth1:
            optional: true

  - path: /etc/freeradius/3.0/clients.conf.d/p45-devices.conf
    permissions: '0640'
    content: |
      client p45-devices {
        ipaddr = 0.0.0.0/0
        secret = P45-RADIUS-KEY
        nas_type = cisco
      }

  - path: /etc/freeradius/3.0/mods-config/files/authorize
    append: true
    content: |
      admin Cleartext-Password := "<CML_PASSWORD>"
              Service-Type = NAS-Prompt-User

runcmd:
  - netplan apply
  - apt-get update -y
  - apt-get install -y freeradius
  - systemctl restart freeradius
