!
hostname CoreSwitch-HQ-1
!
no ip domain lookup
ip domain-name hq.p45.local
!
clock timezone NZST 12 0
clock summer-time NZDT recurring last Sun Sep 2:00 1 Sun Apr 3:00
ntp master 7
ntp source Loopback0
ntp server 156.62.8.200 prefer
ntp server 156.62.1.13
logging host 172.16.80.250
!
username admin privilege 15 secret 0 <CML_PASSWORD>
enable secret 0 <CML_PASSWORD>
aaa new-model
aaa authentication login default group radius local
aaa authorization exec default group radius local
aaa authentication login CONSOLE local
radius server P45-RADIUS
 address ipv4 192.168.80.20 auth-port 1812 acct-port 1813
 key 0 P45-RADIUS-KEY
!
line con 0
 login authentication CONSOLE
!
ip routing
!
vtp mode transparent
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree loopguard default
spanning-tree vlan 1-4094 priority 4096
!
vlan 80
 name SERVERS
vlan 90
 name MGMT
!
interface Loopback0
 description Router ID / management
 ip address 10.255.0.11 255.255.255.255
 ip ospf 1 area 0
!
interface Vlan80
 description SERVERS gateway
 ip address 192.168.80.2 255.255.255.0
 ip ospf 1 area 0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 standby version 2
 standby 80 ip 192.168.80.1
 standby 80 priority 200
 standby 80 preempt delay minimum 90
 standby 80 timers msec 250 msec 750
 standby 80 authentication md5 key-string <P45_HSRP_KEY>
 no shutdown
!
interface Vlan90
 description MGMT (HQ core-side half, routed)
 ip address 192.168.90.11 255.255.255.128
 ip ospf 1 area 0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 standby version 2
 standby 90 ip 192.168.90.1
 standby 90 priority 200
 standby 90 preempt delay minimum 90
 standby 90 timers msec 250 msec 750
 standby 90 authentication md5 key-string <P45_HSRP_KEY>
 no shutdown
!
interface Ethernet0/0
 description to Firewall-HQ-1 GigabitEthernet0/2
 no switchport
 ip address 10.255.5.1 255.255.255.252
 ip ospf dead-interval minimal hello-multiplier 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description to DistSwitch-HQ-1 Ethernet0/0
 no switchport
 ip address 10.255.1.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf dead-interval minimal hello-multiplier 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/3
 description to CoreSwitch-HQ-2 Ethernet0/3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 55,80,90
 no shutdown
!
interface Ethernet1/0
 description to DistSwitch-HQ-2 Ethernet0/3
 no switchport
 ip address 10.255.1.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf dead-interval minimal hello-multiplier 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet1/1
 description to ServerRoomSwitch-HQ-1 Ethernet0/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 80,90
 no shutdown
!
interface Ethernet2/0
 description DCI1 - to CoreSwitch-DR-1 Ethernet0/2
 no switchport
 ip address 10.255.6.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 100
 ip ospf dead-interval minimal hello-multiplier 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet2/1
 description to Firewall-HQ-2 GigabitEthernet0/5
 no switchport
 ip address 10.255.5.25 255.255.255.252
 ip ospf cost 100
 ip ospf dead-interval minimal hello-multiplier 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ip ospf 1 area 0
 no shutdown
!
ip route 172.16.0.0 255.255.0.0 Null0 254
!
ip route 10.60.0.70 255.255.255.255 192.168.80.70 name ANYCAST-FILESERVER
ip prefix-list ANYCAST-SVC seq 5 permit 10.60.0.70/32
route-map ANYCAST-SVC permit 10
 match ip address prefix-list ANYCAST-SVC
 set metric 20
 set metric-type type-2
!
router ospf 1
 router-id 10.255.0.11
 passive-interface default
 no passive-interface Ethernet0/0
 no passive-interface Ethernet0/2
 no passive-interface Ethernet1/0
 no passive-interface Ethernet2/0
 no passive-interface Ethernet2/1
 no passive-interface Vlan90
 redistribute static subnets route-map ANYCAST-SVC
!
ip access-list standard VTY-MGMT
 remark SSH to this device only from the management networks
 permit 192.168.90.0 0.0.0.255
 permit 172.16.90.0 0.0.0.255
 permit 10.255.0.0 0.0.0.255
 deny any log
!
line vty 0 4
 access-class VTY-MGMT in
 transport input ssh
 login authentication default
!
end
