!
hostname AccessSwitch-DR-1
!
no ip domain lookup
ip domain-name dr.p45.local
ntp server 10.255.0.11 prefer
ntp server 10.255.0.111
logging host 172.16.80.250
!
username admin privilege 15 secret 0 <CML_PASSWORD>
enable secret 0 <CML_PASSWORD>
aaa new-model
aaa authentication login default group radius local
aaa authentication login CONSOLE local
radius server P45-RADIUS
 address ipv4 172.16.80.20 auth-port 1812 acct-port 1813
 key 0 P45-RADIUS-KEY
!
line con 0
 login authentication CONSOLE
!
vtp mode transparent
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree loopguard default
!
vlan 10
 name FINANCE
vlan 20
 name HR
vlan 30
 name IT
vlan 40
 name RND
vlan 50
 name SALES
vlan 55
 name DMZ
vlan 60
 name SECURITY
vlan 70
 name TECHSUP
vlan 80
 name SERVERS
vlan 90
 name MGMT
vlan 100
 name GUEST
!
interface Vlan90
 description MGMT
 ip address 172.16.90.31 255.255.255.0
 no shutdown
!
interface Vlan70
 description TEST HOST - simulates a user PC on VLAN 70 (TECHSUP)
 ip address 172.16.70.201 255.255.255.0
 no shutdown
!
ip routing
ip route 0.0.0.0 0.0.0.0 172.16.70.1
!
interface Vlan60
 description DHCP PROBE - proves this site can still lease an address (SECURITY)
 no ip dhcp client request router
 ip address dhcp
 no shutdown
!
interface Ethernet0/0
 description to CoreSwitch-DR-2 Ethernet1/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 60,70,80,90
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface Ethernet0/1
 description to CoreSwitch-DR-1 Ethernet1/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 60,70,80,90
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface Ethernet0/3
 description to Tech/support dept PC eth0
 switchport mode access
 switchport access vlan 70
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
ip dhcp snooping vlan 60,70
no ip dhcp snooping information option
ip dhcp snooping database unix:dhcp-snooping.db
ip dhcp snooping
!
arp access-list DAI-DESKS
 deny ip host 172.16.60.1 mac any log
 deny ip host 172.16.60.2 mac any log
 deny ip host 172.16.60.3 mac any log
 permit ip 172.16.60.96 0.0.0.31 mac any
 permit ip 172.16.60.128 0.0.0.63 mac any
 permit ip 172.16.60.192 0.0.0.7 mac any
 deny ip host 172.16.70.1 mac any log
 deny ip host 172.16.70.2 mac any log
 deny ip host 172.16.70.3 mac any log
 permit ip 172.16.70.96 0.0.0.31 mac any
 permit ip 172.16.70.128 0.0.0.63 mac any
 permit ip 172.16.70.192 0.0.0.7 mac any
!
ip arp inspection filter DAI-DESKS vlan 60,70
ip arp inspection vlan 60,70
!
ip access-list standard VTY-MGMT
 remark SSH to this device only from the management networks
 permit 192.168.90.0 0.0.0.255
 permit 172.16.90.0 0.0.0.255
 permit 10.255.0.0 0.0.0.255
 deny any log
!
line vty 0 4
 access-class VTY-MGMT in
 transport input ssh
 login authentication default
!
end
