!
hostname DMZSwitch-DR-2
!
no ip domain lookup
ip domain-name dr.p45.local
ntp server 10.255.0.11 prefer
ntp server 10.255.0.111
logging host 172.16.80.250
!
username admin privilege 15 secret 0 <CML_PASSWORD>
enable secret 0 <CML_PASSWORD>
aaa new-model
aaa authentication login default group radius local
aaa authentication login CONSOLE local
radius server P45-RADIUS
 address ipv4 172.16.80.20 auth-port 1812 acct-port 1813
 key 0 P45-RADIUS-KEY
!
line con 0
 login authentication CONSOLE
!
vtp mode transparent
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree loopguard default
!
vlan 55
 name DMZ
vlan 90
 name MGMT
!
interface Vlan55
 description In-band management via the DMZ (firewall dmz interface is the gateway)
 ip address 10.50.2.252 255.255.255.0
 no shutdown
!
interface Vlan90
 description unused - VLAN 90 has no path out of the DMZ; managed on Vlan55
 no ip address
 shutdown
!
ip routing
ip route 0.0.0.0 0.0.0.0 10.50.2.1
ip default-gateway 10.50.2.1
!
interface Ethernet0/0
 description to Firewall-DR-2 GigabitEthernet0/5
 switchport mode access
 switchport access vlan 55
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Ethernet0/1
 description to DNS-DMZ-DR-1 eth1
 switchport mode access
 switchport access vlan 55
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Ethernet0/2
 description to DNS-DMZ-DR-2 eth1
 switchport mode access
 switchport access vlan 55
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Ethernet1/0
 description to DMZSwitch-DR-1 Ethernet1/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 55,90
 no shutdown
!
ip access-list standard VTY-MGMT
 remark SSH to this device only from the management networks
 permit 192.168.90.0 0.0.0.255
 permit 172.16.90.0 0.0.0.255
 permit 10.255.0.0 0.0.0.255
 deny any log
!
line vty 0 4
 access-class VTY-MGMT in
 transport input ssh
 login authentication default
!
end
