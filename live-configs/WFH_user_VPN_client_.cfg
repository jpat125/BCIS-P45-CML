#cloud-config
# WFH user — the remote-access ("VPN") client, on a home broadband LAN.
#
#   eth0: 192.168.1.10/24 via 192.168.1.1 (DHCP from HomeRouter-WFH)
#
# The house is PATed behind the CPE, so the corporate side cannot address this
# machine directly. Any head-end failover therefore has to be driven from here,
# which is the honest version of the question D14 asks.
hostname: wfh-user
manage_etc_hosts: true

write_files:
  - path: /etc/netplan/50-p45.yaml
    permissions: '0600'
    content: |
      network:
        version: 2
        ethernets:
          eth0:
            dhcp4: true

runcmd:
  - netplan apply
  - ip route show
  # A home laptop resolves through its router, which forwards to the carrier.
  # It must NOT be given an internal resolver: a machine on the internet that
  # can query internal DNS is the split-horizon leak docs/dns-design.md exists
  # to prevent.
  - apt-get update -y
  - apt-get install -y openvpn curl dnsutils traceroute iperf3
