!
hostname HomeRouter-WFH
!
no ip domain lookup
ip domain-name home.local
!
username admin privilege 15 secret 0 <CML_PASSWORD>
enable secret 0 <CML_PASSWORD>
!
interface Ethernet0/0
 description to ISP-2 (Terrestrial Fibre) GigabitEthernet0/3
 ip address 100.64.1.1 255.255.255.252
 ip nat outside
 no shutdown
!
interface Ethernet0/1
 description to WFH user (VPN client) eth0
 ip address 192.168.1.1 255.255.255.0
 ip nat inside
 no shutdown
!
ip access-list standard HOME-LAN
 permit 192.168.1.0 0.0.0.255
!
route-map NAT-PRIMARY permit 10
 match ip address HOME-LAN
 match interface Ethernet0/0
!
ip nat inside source route-map NAT-PRIMARY interface Ethernet0/0 overload
!
ip sla 1
 icmp-echo 100.64.1.2 source-interface Ethernet0/0
 frequency 5
ip sla schedule 1 life forever start-time now
track 1 ip sla 1 reachability
!
ip route 0.0.0.0 0.0.0.0 Ethernet0/0 100.64.1.2 1 track 1
!
ip dhcp excluded-address 192.168.1.1 192.168.1.9
!
ip dhcp pool HOME
 network 192.168.1.0 255.255.255.0
 default-router 192.168.1.1
 dns-server 192.168.1.1
 domain-name p45.nz
 lease 0 8
!
crypto ikev2 proposal P45-WFH
 encryption aes-cbc-256
 integrity sha256
 group 14
!
crypto ikev2 policy P45-WFH
 proposal P45-WFH
!
crypto ikev2 keyring P45-WFH
 peer Firewall-HQ-1
  address 10.255.4.2
  pre-shared-key <P45_WFH_VPN_PSK>
 !
 peer Firewall-DR-1
  address 10.255.4.18
  pre-shared-key <P45_WFH_VPN_PSK>
 !
!
crypto ikev2 profile P45-WFH
 match identity remote address 10.255.4.2 255.255.255.255
 match identity remote address 10.255.4.18 255.255.255.255
 identity local address 100.64.1.1
 authentication remote pre-share
 authentication local pre-share
 keyring local P45-WFH
 dpd 10 3 periodic
!
crypto ipsec transform-set P45-WFH esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile P45-WFH
 set transform-set P45-WFH
 set ikev2-profile P45-WFH
!
interface Tunnel1
 description VPN to Firewall-HQ-1
 ip address 10.255.7.2 255.255.255.252
 tunnel source Ethernet0/0
 tunnel mode ipsec ipv4
 tunnel destination 10.255.4.2
 tunnel protection ipsec profile P45-WFH
!
ip route 10.255.4.2 255.255.255.255 100.64.1.2
interface Tunnel2
 description VPN to Firewall-DR-1
 ip address 10.255.7.6 255.255.255.252
 tunnel source Ethernet0/0
 tunnel mode ipsec ipv4
 tunnel destination 10.255.4.18
 tunnel protection ipsec profile P45-WFH
!
ip route 10.255.4.18 255.255.255.255 100.64.1.2
ip sla 10
 icmp-echo 10.255.0.11 source-interface Ethernet0/1
 threshold 1000
 timeout 1000
 frequency 5
ip sla schedule 10 life forever start-time now
track 10 ip sla 10 reachability
 delay down 1 up 10
ip route 10.255.0.11 255.255.255.255 Tunnel1 10.255.7.1
ip route 192.168.0.0 255.255.0.0 Tunnel1 10.255.7.1 track 10
ip route 192.168.0.0 255.255.0.0 Tunnel2 10.255.7.5 10
ip route 10.50.0.0 255.255.0.0 Tunnel1 10.255.7.1 track 10
ip route 10.50.0.0 255.255.0.0 Tunnel2 10.255.7.5 10
ip route 172.16.0.0 255.255.0.0 Tunnel1 10.255.7.1 track 10
ip route 172.16.0.0 255.255.0.0 Tunnel2 10.255.7.5 10
ip route 10.60.0.0 255.255.255.0 Tunnel1 10.255.7.1 track 10
ip route 10.60.0.0 255.255.255.0 Tunnel2 10.255.7.5 10
!
ip domain lookup
ip domain lookup source-interface Ethernet0/1
ip domain timeout 1
ip name-server 192.168.80.61 172.16.80.53
ip dns server
!
line vty 0 15
 transport input ssh
!
end
