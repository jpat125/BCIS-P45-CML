#cloud-config
# WebsiteServer-HQ-1 — public + internal web server
hostname: WebsiteServer-HQ-1
manage_etc_hosts: true

write_files:
  - path: /etc/netplan/50-p45.yaml
    permissions: '0600'
    content: |
      network:
        version: 2
        ethernets:
          eth0:
            addresses: [10.50.1.20/24]
            gateway4: 10.50.1.1
            nameservers: {addresses: [10.50.1.1]}
          eth1:
            optional: true

  - path: /var/www/html/index.html
    permissions: '0644'
    content: |
      <html><body>
      <h1>P45 HQ Web Server</h1>
      <p>Host: WebsiteServer-HQ-1</p>
      <p>Site: HQ</p>
      <p>Internal IP: 10.50.1.20</p>
      <p>Public IP: 100.11.0.20</p>
      </body></html>

runcmd:
  - netplan apply
  - apt-get update -y
  - apt-get install -y nginx
  - systemctl restart nginx
