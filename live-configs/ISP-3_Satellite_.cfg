!
hostname ISP-3_Satellite
!
ip domain lookup
!
username admin privilege 15 secret 0 <CML_PASSWORD>
enable secret 0 <CML_PASSWORD>
!
interface Loopback99
 description Simulated public prefix 100.13.0.0 (HQ POP)
 ip address 100.13.0.1 255.255.255.0
 ip ospf 2 area 0
!
interface Loopback98
 description Simulated public prefix 100.23.0.0 (DR POP)
 ip address 100.23.0.1 255.255.255.0
 ip ospf 2 area 0
!
interface GigabitEthernet0/0
 description to EdgeRouter-HQ-1 GigabitEthernet0/2
 ip address 10.255.10.10 255.255.255.252
 bfd interval 500 min_rx 500 multiplier 3
 no bfd echo
 no shutdown
!
interface GigabitEthernet0/1
 description to EdgeRouter-HQ-2 GigabitEthernet0/2
 ip address 10.255.10.22 255.255.255.252
 bfd interval 500 min_rx 500 multiplier 3
 no bfd echo
 no shutdown
!
interface GigabitEthernet0/2
 description to EdgeRouter-DR-1 GigabitEthernet0/2
 ip address 10.255.20.10 255.255.255.252
 bfd interval 500 min_rx 500 multiplier 3
 no bfd echo
 no shutdown
!
interface GigabitEthernet0/3
 description to EdgeRouter-DR-2 GigabitEthernet0/0
 ip address 10.255.20.14 255.255.255.252
 bfd interval 500 min_rx 500 multiplier 3
 no bfd echo
 no shutdown
!
interface GigabitEthernet0/4
 description to ISP-1 (Terrestrial Fibre) GigabitEthernet0/5
 ip address 100.64.0.6 255.255.255.252
 ip ospf network point-to-point
 ip ospf 2 area 0
 no shutdown
!
interface GigabitEthernet0/5
 description to ISP-2 (Terrestrial Fibre) GigabitEthernet0/6
 ip address 100.64.0.10 255.255.255.252
 ip ospf network point-to-point
 ip ospf 2 area 0
 no shutdown
!
interface GigabitEthernet0/6
 description to Internet-WebServer-1 eth2
 ip address 100.64.2.9 255.255.255.252
 no shutdown
!
ip route 100.100.100.100 255.255.255.255 100.64.2.10   ! internet website
!
ip dns server
ip host www.internet.example 100.100.100.100
ip name-server 192.168.255.1
!
router ospf 2
 router-id 100.13.0.1
 passive-interface default
 no passive-interface GigabitEthernet0/4
 no passive-interface GigabitEthernet0/5
 redistribute static subnets
 redistribute connected subnets
 redistribute bgp 64503 subnets
!
ip prefix-list EDGE-OUT seq 5 permit 0.0.0.0/0
ip prefix-list EDGE-OUT seq 15 permit 10.255.0.161/32
ip prefix-list EDGE-OUT seq 20 permit 10.255.0.162/32
ip prefix-list EDGE-OUT seq 25 permit 10.255.0.61/32
ip prefix-list EDGE-OUT seq 30 permit 10.255.0.62/32
ip prefix-list CUST-EdgeRouter-HQ-2 seq 5 permit 10.255.4.8/30
ip prefix-list CUST-EdgeRouter-HQ-2 seq 10 permit 10.255.4.12/30
ip prefix-list CUST-EdgeRouter-HQ-2 seq 15 permit 192.168.0.0/16
ip prefix-list CUST-EdgeRouter-HQ-2 seq 20 permit 10.255.0.62/32
ip prefix-list CUST-EdgeRouter-HQ-2 seq 25 permit 100.11.0.20/32
ip prefix-list CUST-EdgeRouter-HQ-1 seq 5 permit 10.255.4.0/30
ip prefix-list CUST-EdgeRouter-HQ-1 seq 10 permit 10.255.4.4/30
ip prefix-list CUST-EdgeRouter-HQ-1 seq 15 permit 192.168.0.0/16
ip prefix-list CUST-EdgeRouter-HQ-1 seq 20 permit 100.11.0.61/32
ip prefix-list CUST-EdgeRouter-HQ-1 seq 25 permit 10.255.0.61/32
ip prefix-list CUST-EdgeRouter-HQ-1 seq 30 permit 100.11.0.53/32
ip prefix-list CUST-EdgeRouter-HQ-1 seq 35 permit 100.11.0.20/32
ip prefix-list CUST-EdgeRouter-DR-2 seq 5 permit 10.255.4.24/30
ip prefix-list CUST-EdgeRouter-DR-2 seq 10 permit 10.255.4.28/30
ip prefix-list CUST-EdgeRouter-DR-2 seq 15 permit 172.16.0.0/16
ip prefix-list CUST-EdgeRouter-DR-2 seq 20 permit 100.22.0.62/32
ip prefix-list CUST-EdgeRouter-DR-2 seq 25 permit 10.255.0.162/32
ip prefix-list CUST-EdgeRouter-DR-2 seq 30 permit 100.22.0.20/32
ip prefix-list CUST-EdgeRouter-DR-1 seq 5 permit 10.255.4.16/30
ip prefix-list CUST-EdgeRouter-DR-1 seq 10 permit 10.255.4.20/30
ip prefix-list CUST-EdgeRouter-DR-1 seq 15 permit 172.16.0.0/16
ip prefix-list CUST-EdgeRouter-DR-1 seq 20 permit 10.255.0.161/32
ip prefix-list CUST-EdgeRouter-DR-1 seq 25 permit 100.22.0.53/32
ip prefix-list CUST-EdgeRouter-DR-1 seq 30 permit 100.22.0.20/32
router bgp 64503
 bgp router-id 100.13.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.10.21 remote-as 65001
 neighbor 10.255.10.21 description EdgeRouter-HQ-2
 neighbor 10.255.10.21 password <P45_BGP_KEY>
 neighbor 10.255.10.21 fall-over bfd
 neighbor 10.255.10.9 remote-as 65001
 neighbor 10.255.10.9 description EdgeRouter-HQ-1
 neighbor 10.255.10.9 password <P45_BGP_KEY>
 neighbor 10.255.10.9 fall-over bfd
 neighbor 10.255.20.13 remote-as 65002
 neighbor 10.255.20.13 description EdgeRouter-DR-2
 neighbor 10.255.20.13 password <P45_BGP_KEY>
 neighbor 10.255.20.13 fall-over bfd
 neighbor 10.255.20.9 remote-as 65002
 neighbor 10.255.20.9 description EdgeRouter-DR-1
 neighbor 10.255.20.9 password <P45_BGP_KEY>
 neighbor 10.255.20.9 fall-over bfd
 !
 address-family ipv4
  neighbor 10.255.10.21 activate
  neighbor 10.255.10.21 default-originate
  neighbor 10.255.10.21 prefix-list CUST-EdgeRouter-HQ-2 in
  neighbor 10.255.10.21 prefix-list EDGE-OUT out
  neighbor 10.255.10.21 maximum-prefix 20
  neighbor 10.255.10.9 activate
  neighbor 10.255.10.9 default-originate
  neighbor 10.255.10.9 prefix-list CUST-EdgeRouter-HQ-1 in
  neighbor 10.255.10.9 prefix-list EDGE-OUT out
  neighbor 10.255.10.9 maximum-prefix 20
  neighbor 10.255.20.13 activate
  neighbor 10.255.20.13 default-originate
  neighbor 10.255.20.13 prefix-list CUST-EdgeRouter-DR-2 in
  neighbor 10.255.20.13 prefix-list EDGE-OUT out
  neighbor 10.255.20.13 maximum-prefix 20
  neighbor 10.255.20.9 activate
  neighbor 10.255.20.9 default-originate
  neighbor 10.255.20.9 prefix-list CUST-EdgeRouter-DR-1 in
  neighbor 10.255.20.9 prefix-list EDGE-OUT out
  neighbor 10.255.20.9 maximum-prefix 20
 exit-address-family
!
line con 0
 transport preferred none
line vty 0 15
 transport preferred none
 transport input ssh
!
end
