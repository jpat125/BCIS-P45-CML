!
hostname Firewall-HQ-1
domain-name hq.p45.local
!
license smart
 feature tier standard
 throughput level 1G
!
enable password <CML_PASSWORD>
username admin password <CML_PASSWORD> privilege 15
aaa authentication ssh console LOCAL
!
interface GigabitEthernet0/0
 description to EdgeRouter-HQ-1 GigabitEthernet0/3
 nameif outside
 security-level 0
 ip address 10.255.4.2 255.255.255.252
 ospf dead-interval minimal hello-multiplier 4
 ospf authentication message-digest
 ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 no shutdown
!
interface GigabitEthernet0/1
 description LAN FAILOVER LINK - unused, see the note at the top of this file
 shutdown
!
interface GigabitEthernet0/2
 description to CoreSwitch-HQ-1 Ethernet0/0
 nameif inside
 security-level 100
 ip address 10.255.5.2 255.255.255.252
 ospf dead-interval minimal hello-multiplier 4
 ospf authentication message-digest
 ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 no shutdown
!
interface GigabitEthernet0/3
 description to EdgeRouter-HQ-2 GigabitEthernet0/5
 nameif outside2
 security-level 0
 ip address 10.255.4.14 255.255.255.252
 ospf dead-interval minimal hello-multiplier 4
 ospf authentication message-digest
 ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ospf cost 100
 no shutdown
!
interface GigabitEthernet0/4
 description to DMZSwitch-HQ-1 Ethernet0/0
 nameif dmz
 security-level 50
 ip address 10.50.1.1 255.255.255.0
 ospf dead-interval minimal hello-multiplier 4
 ospf authentication message-digest
 ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ospf cost 200
 no shutdown
!
interface GigabitEthernet0/5
 description to CoreSwitch-HQ-2 Ethernet1/3
 nameif inside2
 security-level 100
 ip address 10.255.5.30 255.255.255.252
 ospf dead-interval minimal hello-multiplier 4
 ospf authentication message-digest
 ospf message-digest-key 1 md5 <P45_OSPF_KEY>
 ospf cost 100
 no shutdown
!
prefix-list FW-DISCARD seq 5 permit 192.168.0.0/16
prefix-list FW-DISCARD seq 10 permit 172.16.0.0/16
prefix-list FW-DISCARD seq 15 permit 10.50.0.0/16
prefix-list FW-DISCARD seq 20 permit 10.60.0.0/24
route-map OSPF-STATIC deny 10
 match ip address prefix-list FW-DISCARD
!
route-map OSPF-STATIC permit 20
!
router ospf 1
 router-id 10.255.0.71
 network 10.255.4.0 255.255.255.252 area 0
 network 10.255.5.0 255.255.255.252 area 0
 network 10.255.4.12 255.255.255.252 area 0
 network 10.50.1.0 255.255.255.0 area 0
 network 10.255.5.28 255.255.255.252 area 0
 log-adj-changes
 redistribute static subnets route-map OSPF-STATIC
!
route outside 0.0.0.0 0.0.0.0 10.255.4.1 254
route Null0 192.168.0.0 255.255.0.0 254
route Null0 172.16.0.0 255.255.0.0 254
route Null0 10.50.0.0 255.255.0.0 254
route Null0 10.60.0.0 255.255.255.0 254
!
sla monitor 100
 type echo protocol ipIcmpEcho 10.50.1.20 interface dmz
 frequency 10
sla monitor schedule 100 life forever start-time now
track 100 rtr 100 reachability
route dmz 10.50.100.20 255.255.255.255 10.50.1.20 1 track 100
!
same-security-traffic permit inter-interface
same-security-traffic permit intra-interface
!
timeout floating-conn 0:00:30
!
icmp permit any outside
icmp permit any inside
icmp permit any outside2
icmp permit any dmz
icmp permit any inside2
!
ntp server 10.255.0.11 prefer
ntp server 10.255.0.12
logging enable
logging timestamp
logging trap informational
logging host inside 172.16.80.250
!
object-group network CORP-ALL
 network-object 10.0.0.0 255.0.0.0
 network-object 172.16.0.0 255.255.0.0
 network-object 192.168.0.0 255.255.0.0
!
object network INSIDE-NET
 subnet 192.168.0.0 255.255.0.0
!
object network DMZ-NET
 subnet 10.50.1.0 255.255.255.0
!
object network CORE-INFRA
 subnet 10.255.0.0 255.255.0.0
!
object network OTHER-SITE-NET
 subnet 172.16.0.0 255.255.0.0
!
nat (inside,outside) source static CORP-ALL CORP-ALL destination static CORP-ALL CORP-ALL no-proxy-arp route-lookup
nat (inside,outside) source dynamic INSIDE-NET interface
nat (inside,outside) source dynamic CORE-INFRA interface
nat (inside,outside) source dynamic OTHER-SITE-NET interface
nat (inside,outside2) source static CORP-ALL CORP-ALL destination static CORP-ALL CORP-ALL no-proxy-arp route-lookup
nat (inside,outside2) source dynamic INSIDE-NET interface
nat (inside,outside2) source dynamic CORE-INFRA interface
nat (inside,outside2) source dynamic OTHER-SITE-NET interface
nat (inside2,outside) source static CORP-ALL CORP-ALL destination static CORP-ALL CORP-ALL no-proxy-arp route-lookup
nat (inside2,outside) source dynamic INSIDE-NET interface
nat (inside2,outside) source dynamic CORE-INFRA interface
nat (inside2,outside) source dynamic OTHER-SITE-NET interface
nat (inside2,outside2) source static CORP-ALL CORP-ALL destination static CORP-ALL CORP-ALL no-proxy-arp route-lookup
nat (inside2,outside2) source dynamic INSIDE-NET interface
nat (inside2,outside2) source dynamic CORE-INFRA interface
nat (inside2,outside2) source dynamic OTHER-SITE-NET interface
object network DMZ-DNS-REAL
 host 10.50.1.53
!
object network DMZ-DNS-PUBLIC
 host 100.11.0.53
!
object network WEBSITE-HQ-REAL
 host 10.50.1.20
!
object network WEBSITE-HQ-PUBLIC
 host 100.11.0.20
!
nat (inside,dmz) source static CORP-ALL CORP-ALL destination static CORP-ALL CORP-ALL no-proxy-arp route-lookup
nat (dmz,outside) source static CORP-ALL CORP-ALL destination static CORP-ALL CORP-ALL no-proxy-arp route-lookup
nat (dmz,outside) source static DMZ-DNS-REAL DMZ-DNS-PUBLIC
nat (dmz,outside) source dynamic DMZ-NET interface
nat (dmz,outside) source static WEBSITE-HQ-REAL WEBSITE-HQ-PUBLIC
nat (dmz,outside2) source static CORP-ALL CORP-ALL destination static CORP-ALL CORP-ALL no-proxy-arp route-lookup
nat (dmz,outside2) source static DMZ-DNS-REAL DMZ-DNS-PUBLIC
nat (dmz,outside2) source dynamic DMZ-NET interface
nat (dmz,outside2) source static WEBSITE-HQ-REAL WEBSITE-HQ-PUBLIC
!
access-list OUTSIDE-IN extended permit udp 10.255.4.0 255.255.255.0 10.255.0.0 255.255.255.0 eq ntp
access-list OUTSIDE-IN extended permit udp 10.255.4.0 255.255.255.0 host 192.168.80.20 range 1812 1813
access-list OUTSIDE-IN extended permit udp 10.255.4.0 255.255.255.0 host 172.16.80.250 eq syslog
access-list OUTSIDE-IN extended permit icmp any any
access-list OUTSIDE-IN extended permit tcp any host 10.50.1.20 eq https
access-list OUTSIDE-IN extended permit tcp any host 10.50.1.20 eq www
access-list OUTSIDE-IN extended permit ospf any any
access-list OUTSIDE-IN extended permit udp any host 10.50.1.53 eq domain
access-list OUTSIDE-IN extended permit tcp any host 10.50.1.53 eq domain
access-list OUTSIDE-IN extended deny ip any any
access-group OUTSIDE-IN in interface outside
access-group OUTSIDE-IN in interface outside2
!
access-list DMZ-IN extended permit udp host 10.50.1.251 10.255.0.0 255.255.255.0 eq ntp
access-list DMZ-IN extended permit udp host 10.50.1.251 host 192.168.80.20 range 1812 1813
access-list DMZ-IN extended permit udp host 10.50.1.251 host 172.16.80.250 eq syslog
access-list DMZ-IN extended permit udp host 10.50.1.252 10.255.0.0 255.255.255.0 eq ntp
access-list DMZ-IN extended permit udp host 10.50.1.252 host 192.168.80.20 range 1812 1813
access-list DMZ-IN extended permit udp host 10.50.1.252 host 172.16.80.250 eq syslog
access-list DMZ-IN extended deny ip any 192.168.0.0 255.255.0.0
access-list DMZ-IN extended deny ip any 172.16.0.0 255.255.0.0
access-list DMZ-IN extended permit udp 10.50.1.0 255.255.255.0 any eq domain
access-list DMZ-IN extended permit tcp 10.50.1.0 255.255.255.0 any eq domain
access-list DMZ-IN extended permit tcp 10.50.1.0 255.255.255.0 any eq www
access-list DMZ-IN extended permit tcp 10.50.1.0 255.255.255.0 any eq https
access-list DMZ-IN extended permit icmp any any
access-list DMZ-IN extended deny ip any any
access-group DMZ-IN in interface dmz
!
crypto ikev2 policy 10
 encryption aes-256
 integrity sha256
 group 14
 prf sha256
 lifetime seconds 86400
crypto ikev2 enable outside
crypto ipsec ikev2 ipsec-proposal P45-WFH
 protocol esp encryption aes-256
 protocol esp integrity sha-256
crypto ipsec profile P45-WFH
 set ikev2 ipsec-proposal P45-WFH
tunnel-group 100.64.1.1 type ipsec-l2l
tunnel-group 100.64.1.1 ipsec-attributes
 ikev2 remote-authentication pre-shared-key <P45_WFH_VPN_PSK>
 ikev2 local-authentication pre-shared-key <P45_WFH_VPN_PSK>
!
interface Tunnel1
 description VPN to HomeRouter-WFH (teleworker)
 nameif wfh
 ip address 10.255.7.1 255.255.255.252
 tunnel source interface outside
 tunnel destination 100.64.1.1
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile P45-WFH
!
sla monitor 2
 type echo protocol ipIcmpEcho 10.255.0.11 interface inside
 frequency 5
sla monitor schedule 2 life forever start-time now
track 2 rtr 2 reachability
route wfh 192.168.1.0 255.255.255.0 10.255.7.2 1 track 2
access-list WFH-IN extended permit ip 192.168.1.0 255.255.255.0 any
access-group WFH-IN in interface wfh
!
policy-map global_policy
 class inspection_default
  inspect icmp
  inspect icmp error
!
ssh 192.168.90.0 255.255.255.0 inside
ssh version 2
!
end
